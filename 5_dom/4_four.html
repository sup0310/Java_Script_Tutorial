<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM || JavaScript</title>
</head>
<body style="background-color: #212121; color:#fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>

    // ADD
    function addLanguage(language) {
        const li = document.createElement('li');
        li.innerHTML = language;
        document.querySelector('.language').appendChild(li);
    }
    addLanguage('Python');
    addLanguage('Java');


    function addOptiLanguage(language) {
        const li = document.createElement('li');
        const text = document.createTextNode(language);
        li.appendChild(text);
        document.querySelector('.language').appendChild(li);
    }
    addOptiLanguage('C++');
    addOptiLanguage('Ruby');

    // EDIT
    const secondLang = document.querySelector("li:nth-child(4)");
    // secondLang.innerHTML = 'C#';
    const newli = document.createElement('li');
    newli.textContent = 'C#';
    secondLang.replaceWith(newli);

    const firstlang = document.querySelector("li:first-child");
    // firstlang.innerHTML = "TypeScript";
    firstlang.outerHTML = '<li>TypeScript</li>';

    
    // REMOVE
    const lastLang = document.querySelector("li:last-child");
    // lastLang.remove();
    // lastLang.parentElement.removeChild(lastLang);

    // DELETE
    const thirdLang = document.querySelector("li:nth-child(3)");
    // thirdLang.remove();
    // thirdLang.parentElement.removeChild(thirdLang);

</script>
</html>
